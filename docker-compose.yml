version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      - MONGO_URI=mongodb://db:27017
      - WEB_SERVICE_URL=http://web-service:8001
    depends_on:
      db:
        condition: service_healthy
      web-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: mongo:6
    volumes:
      - mongo_data:/data/db
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-service:
    build: ./web-service
    expose:
      - "8001"
    ports:
      # Не обязательно пробрасывать наружу, достаточно внутренней сети
      # - "8001:8001" 

volumes:
  mongo_data:
